<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1526">
<meta name="robots" content="noindex">
<title>CloudSpace — prototipo tema nube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1526; --bg2:#12223d;
  --card:rgba(24,40,70,.55); --card2:rgba(255,255,255,.04); --line:rgba(190,215,255,.12); --line2:rgba(190,215,255,.22);
  --txt:#eef4ff; --mut:#a3b4d1; --mut2:#7f91b0;
  --sky:#7cc4ff; --sky2:#4f9dff; --peri:#a5b4fc; --mint:#6ee7c8; --sun:#ffd27a; --rose:#ff9eb5; --cloud:#e6efff;
  --on-sky:#062038;
  --r:22px; --ease:cubic-bezier(.22,.9,.24,1);
  --shadow:0 20px 50px rgba(3,10,25,.45);
  --grad:linear-gradient(135deg,#9bd5ff,#5aa8ff);
}
[data-theme=light]{
  --bg:#dfeaf8; --bg2:#eef4fc;
  --card:rgba(255,255,255,.72); --card2:rgba(20,50,100,.04); --line:rgba(40,80,140,.12); --line2:rgba(40,80,140,.22);
  --txt:#13233d; --mut:#4b5f80; --mut2:#6b7f9f;
  --sky:#1f7fe0; --sky2:#1667c2; --peri:#5a63d8; --mint:#0f9b7a; --sun:#b7790a; --rose:#d43f6a; --cloud:#13233d;
  --on-sky:#ffffff; --shadow:0 20px 50px rgba(40,80,140,.18);
  --grad:linear-gradient(135deg,#3b98f0,#1f6fd1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{display:block;flex:none}
a{color:var(--sky)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:10px}

/* ---------- Cielo ---------- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#24406e 0%,var(--bg2) 45%,var(--bg) 100%)}
[data-theme=light] .sky{background:radial-gradient(120% 80% at 50% -10%,#ffffff 0%,#e7f0fb 45%,var(--bg) 100%)}
.sky .cl{position:absolute;border-radius:50%;filter:blur(60px);background:rgba(160,195,255,.16);transition:transform 2s var(--ease)}
[data-theme=light] .sky .cl{background:rgba(255,255,255,.9)}
.sky .c1{width:60vw;height:28vh;left:-12vw;top:6vh}
.sky .c2{width:46vw;height:24vh;left:52vw;top:-4vh;background:rgba(124,196,255,.14)}
.sky .c3{width:70vw;height:30vh;left:20vw;top:62vh;background:rgba(165,180,252,.10)}
.sky .c4{width:40vw;height:22vh;left:-8vw;top:78vh}
.sky svg.puffs{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:auto;opacity:.10}
[data-theme=light] .sky svg.puffs{opacity:.5}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff7,transparent),radial-gradient(1.4px 1.4px at 88% 30%,#fff6,transparent),radial-gradient(1px 1px at 35% 8%,#fff6,transparent),radial-gradient(1px 1px at 55% 26%,#fff5,transparent)}
[data-theme=light] .stars{display:none}

/* ---------- Barra superior (PC) ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:16px 28px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:linear-gradient(var(--bg) 0%,transparent 100%)}
[data-theme=light] .top{background:linear-gradient(rgba(223,234,248,.9),transparent)}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.3px;white-space:nowrap}
.logo .mk{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:var(--on-sky);box-shadow:0 6px 20px rgba(90,168,255,.35)}
.nav{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin:0 auto;backdrop-filter:blur(16px)}
.nav a{position:relative;z-index:1;padding:9px 15px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut);text-decoration:none;white-space:nowrap;transition:color .25s}
.nav a:hover{color:var(--txt)}
.nav a.on{color:var(--txt)}
.nav .ind{position:absolute;top:4px;bottom:4px;border-radius:999px;background:rgba(124,196,255,.16);border:1px solid rgba(124,196,255,.3);transition:left .5s var(--ease),width .5s var(--ease)}
.tools{display:flex;gap:10px;align-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--txt);transition:background .2s,border-color .2s;position:relative;flex:none}
.ibtn:hover{background:rgba(124,196,255,.12);border-color:var(--line2)}
.ibtn.sm{width:36px;height:36px}
.qk{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:13.5px;white-space:nowrap}
.qk kbd{font:inherit;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e6f2ff,#b9d8ff);color:#0b2a4d;display:grid;place-items:center;font-weight:800;font-size:14px;box-shadow:0 0 0 3px rgba(124,196,255,.35)}

/* ---------- Barra inferior (móvil) ---------- */
.mnav{display:none}
.fab{display:none}

/* ---------- Página ---------- */
main{max-width:1380px;margin:0 auto;padding:8px 28px 60px}
.view{animation:inBlur .55s var(--ease) both}
.view.out{animation:outBlur .2s ease forwards}
@keyframes inBlur{from{opacity:0;filter:blur(12px);transform:translateY(8px)}to{opacity:1;filter:none;transform:none}}
@keyframes outBlur{to{opacity:0;filter:blur(12px);transform:translateY(-4px)}}
.stg>*{animation:inBlur .6s var(--ease) both}
.stg>*:nth-child(2){animation-delay:.04s}.stg>*:nth-child(3){animation-delay:.08s}.stg>*:nth-child(4){animation-delay:.12s}.stg>*:nth-child(5){animation-delay:.16s}.stg>*:nth-child(6){animation-delay:.2s}.stg>*:nth-child(n+7){animation-delay:.24s}
.head{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin:10px 0 24px}
.head h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.8px;min-width:170px}
.head h1 small{display:block;font-size:15px;font-weight:600;color:var(--mut);letter-spacing:0;margin-bottom:4px}
.kpis{display:flex;gap:30px;flex-wrap:wrap;flex:1}
.kpi{display:flex;align-items:center;gap:12px}
.kpi .ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--sky)}
.kpi b{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
.kpi span.l{display:block;font-size:12.5px;color:var(--mut);margin-top:1px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap}
.t-sky{background:rgba(124,196,255,.18);color:var(--sky)} .t-mint{background:rgba(110,231,200,.16);color:var(--mint)} .t-sun{background:rgba(255,210,122,.16);color:var(--sun)} .t-rose{background:rgba(255,158,181,.16);color:var(--rose)} .t-peri{background:rgba(165,180,252,.16);color:var(--peri)} .t-mut{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);position:relative;min-width:0}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 45%)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:36px}
.ch h2{font-size:15.5px;font-weight:700}
.ch .r{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.big{font-size:32px;font-weight:800;letter-spacing:-.8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big small{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:0}
.mut{color:var(--mut)} .sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.empty{padding:28px 10px;text-align:center;color:var(--mut);font-size:14px}
.empty svg{margin:0 auto 10px;opacity:.6}

/* ---------- Botones y campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s}
.btn.pri{background:var(--grad);color:var(--on-sky);box-shadow:0 8px 22px rgba(79,157,255,.3)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(79,157,255,.4)}
.btn.gh{border:1px solid var(--line);background:var(--card2)}
.btn.gh:hover{border-color:var(--line2);background:rgba(124,196,255,.08)}
.btn.dan{background:rgba(255,120,140,.14);color:var(--rose);border:1px solid rgba(255,120,140,.3)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap;min-height:34px}
.seg button.on{background:rgba(124,196,255,.18);color:var(--txt)}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.chip.on{background:rgba(124,196,255,.16);border-color:rgba(124,196,255,.45)}
.chip .n{font-size:11.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--mut)}
.inp{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,10,30,.22);outline:0;font-size:15px;transition:border-color .2s,background .2s}
[data-theme=light] .inp{background:#fff}
.inp:focus{border-color:var(--sky);background:rgba(0,10,30,.3)}
.inp::placeholder{color:var(--mut2)}
textarea.inp{resize:vertical;min-height:90px;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.inp option{background:#132440;color:#eef4ff}
.search{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);color:var(--mut);min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14px;color:var(--txt)}
.search input::placeholder{color:var(--mut2)}
.check{width:24px;height:24px;border-radius:8px;border:1.8px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--on-sky);transition:.2s}
.check.on{background:var(--sky);border-color:var(--sky)}
.check.round{border-radius:50%}
.bar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--sky);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}

/* ---------- Ventanas (diálogos) ---------- */
.ovl{position:fixed;inset:0;z-index:60;background:rgba(4,12,28,.55);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px;animation:fade .2s ease}
[data-theme=light] .ovl{background:rgba(40,70,120,.25)}
@keyframes fade{from{opacity:0}}
.dlg{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;background:linear-gradient(180deg,rgba(30,50,86,.96),rgba(18,32,58,.97));border:1px solid var(--line2);border-radius:26px;box-shadow:var(--shadow);animation:pop .35s var(--ease)}
[data-theme=light] .dlg{background:linear-gradient(180deg,#fff,#f3f8ff)}
.dlg.wide{width:min(760px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dlg-h{display:flex;align-items:center;gap:12px;padding:20px 22px 6px;position:sticky;top:0;background:inherit;z-index:2}
.dlg-h h3{font-size:19px;font-weight:800;flex:1}
.dlg-h .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:rgba(124,196,255,.15);color:var(--sky)}
.dlg-b{padding:14px 22px 6px;display:flex;flex-direction:column;gap:14px}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px 22px;position:sticky;bottom:0;background:inherit;flex-wrap:wrap}
.dlg-f .left{margin-right:auto}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.opt.on{border-color:var(--sky);background:rgba(124,196,255,.16)}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line2)}
.swatch.on{border-color:var(--txt)}
.err{color:var(--rose);font-size:13px;font-weight:600;min-height:0}
.hint{font-size:12.5px;color:var(--mut)}
.steps-l{display:flex;flex-direction:column;gap:8px}
.step-r{display:flex;gap:8px;align-items:center}

/* menú contextual */
.menu{position:fixed;z-index:70;min-width:200px;padding:6px;border-radius:16px;background:rgba(22,38,68,.98);border:1px solid var(--line2);box-shadow:var(--shadow);animation:pop .2s var(--ease)}
[data-theme=light] .menu{background:#fff}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;text-align:left}
.menu button:hover{background:rgba(124,196,255,.12)}
.menu button.dan{color:var(--rose)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

/* aviso */
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,16px);opacity:0;display:flex;align-items:center;gap:12px;padding:12px 16px 12px 18px;border-radius:999px;background:rgba(20,36,64,.96);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:14px;font-weight:600;transition:.35s var(--ease);pointer-events:none;max-width:calc(100vw - 32px)}
[data-theme=light] .toast{background:#fff}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--sky);font-weight:800;min-height:32px;padding:0 6px}

/* paleta Ctrl+K */
.pal{width:min(620px,100%);align-self:start;margin-top:10vh}
.pal .pin{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pal .pin input{flex:1;background:none;border:0;outline:0;font-size:17px;color:var(--txt);min-width:0}
.pal .parse{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px 0}
.pal .pl{padding:8px;max-height:46vh;overflow:auto}
.pal .pl button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border-radius:12px;font-size:14.5px;font-weight:600;text-align:left}
.pal .pl button.sel,.pal .pl button:hover{background:rgba(124,196,255,.12)}
.pal .pl .gt{font-size:11.5px;font-weight:800;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase;padding:10px 12px 4px}

/* hoja "Más" (móvil) */
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-grid a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--txt);font-size:13px;font-weight:700}
.sheet-grid a .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(124,196,255,.14);color:var(--sky)}

/* ---------- Resumen ---------- */
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.qa .btn{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px)}
.qa .btn svg{color:var(--sky)}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.stage{display:flex;flex-direction:column;gap:6px}
.stage .st{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;font-size:14px;color:var(--mut)}
.stage .st.now{background:rgba(124,196,255,.14);border:1px solid rgba(124,196,255,.35);color:var(--txt);font-weight:700}
.stage .st time{font-size:12.5px;width:92px;flex:none}
.cmap{display:grid;grid-template-columns:120px repeat(35,minmax(0,1fr));gap:3px;align-items:center}
.cmap .hn{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.cmap i{aspect-ratio:1;border-radius:3px;background:var(--card2);display:block}
.cmap i.d{opacity:1}
.cmap i.ns{background:transparent;border:1px dashed var(--line)}
.tline{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.tline:last-child{border-bottom:0}
.tline .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tline.done .tt{text-decoration:line-through;color:var(--mut)}
.quote{font-size:19px;line-height:1.45;font-weight:600;font-style:italic}
.cop{display:flex;flex-direction:column;gap:8px}
.cop .ci{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.cop .ci time{font-size:12px;color:var(--mut);width:46px;flex:none}
.cop .ci.ok{opacity:.55}
.cop .ci.ok .tx{text-decoration:line-through}
.obs{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;line-height:1.4}
.obs .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.wbars{display:flex;align-items:flex-end;gap:8px;height:130px}
.wbars .wb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;gap:6px;height:100%}
.wbars .wb i{display:block;border-radius:8px 8px 6px 6px;background:var(--sky);transform-origin:bottom;animation:growY .9s var(--ease) both}
.wbars .wb span{font-size:11.5px;color:var(--mut);text-align:center}

/* ---------- Tareas ---------- */
.tlay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.tside{display:flex;flex-direction:column;gap:2px;position:sticky;top:90px}
.tside .gt{font-size:11.5px;font-weight:800;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 6px}
.tside button{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mut);text-align:left}
.tside button:hover{background:var(--card2);color:var(--txt)}
.tside button.on{background:rgba(124,196,255,.14);color:var(--txt)}
.tside button .n{margin-left:auto;font-size:12px;color:var(--mut2)}
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tbar .search{flex:1 1 220px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;backdrop-filter:blur(16px);transition:border-color .2s,transform .2s}
.trow:hover{border-color:var(--line2)}
.trow .tb{flex:1;min-width:0}
.trow .tt{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .tt{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--mut)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.pflag{width:10px;height:10px;border-radius:3px;flex:none}
.p1{background:#ff7a8f}.p2{background:#ffb35c}.p3{background:#7cc4ff}.p4{background:#7f91b0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.tcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-height:150px;backdrop-filter:blur(16px)}
.tcard .tt{font-size:15.5px;font-weight:700;line-height:1.3}
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.col{border-radius:20px;background:rgba(10,22,44,.3);border:1px solid var(--line);padding:10px;min-height:200px;transition:background .2s,border-color .2s}
[data-theme=light] .col{background:rgba(255,255,255,.45)}
.col.over{border-color:var(--sky);background:rgba(124,196,255,.08)}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 6px 12px;font-size:14.5px;font-weight:800}
.col-h .n{font-size:12px;color:var(--mut);background:var(--card2);padding:1px 8px;border-radius:6px;font-weight:700}
.col-h .ibtn{margin-left:auto}
.kcard{padding:13px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:grab;backdrop-filter:blur(16px)}
.kcard.drag{opacity:.4}
.kcard .tt{font-size:14.5px;font-weight:700;line-height:1.3;margin:2px 0 8px}
.col.fold .kcard{display:none}

/* ---------- Hábitos ---------- */
.hlay{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.hcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);backdrop-filter:blur(18px);transition:border-color .25s}
.hcard.sel{border-color:var(--hc)}
.hic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.hweek button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut);min-height:44px;justify-content:center}
.hweek button i{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--line2);display:block}
.hweek button.ns i{border-style:dashed;opacity:.5}
.cal35{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal35 button{aspect-ratio:1;border-radius:10px;font-size:12px;font-weight:700;color:var(--mut);background:var(--card2);border:1.5px solid transparent;display:grid;place-items:center}
.cal35 button.today{border-color:var(--txt)}
.cal35 .wd{font-size:11px;color:var(--mut2);text-align:center;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stats4>div{padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.stats4 b{display:block;font-size:20px;font-weight:800}
.stats4 span{font-size:12px;color:var(--mut)}

/* ---------- Tiempo ---------- */
.tlay2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.ringw{position:relative;width:300px;height:300px;margin:6px auto}
.ringw .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.clock{font-size:64px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums;line-height:1}
.blocks{display:flex;gap:4px}
.blocks>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.blocks .bb{height:9px;border-radius:5px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.blocks .bb i{display:block;height:100%}
.blocks span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;justify-content:center;align-items:center;gap:16px}
.play{width:84px;height:84px;border-radius:50%;background:var(--grad);color:var(--on-sky);display:grid;place-items:center;box-shadow:0 12px 34px rgba(79,157,255,.4)}
.hist{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border-bottom:0}

/* ---------- Diario ---------- */
.jtabs{margin-bottom:18px}
.jlay{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.paper{font-family:'Newsreader',Georgia,serif;font-size:19px;line-height:1.75;min-height:340px;background-image:repeating-linear-gradient(transparent 0 32px,var(--line) 32px 33px);background-attachment:local;padding:6px 4px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mcal button{aspect-ratio:1.1;border-radius:12px;background:var(--card2);border:1.5px solid transparent;font-size:13px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mcal button.has{color:var(--txt)}
.mcal button.sel{border-color:var(--sky)}
.mcal button i{width:6px;height:6px;border-radius:50%;display:block}
.idea{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px)}
.idea p{font-size:15px;line-height:1.45}
.mood{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Finanzas ---------- */
.mov{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;min-width:0}
.mov:last-child{border-bottom:0}
.mov .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--card2);border:1px solid var(--line)}
.mov .mt{flex:1;min-width:0}
.mov .mt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .mt span{font-size:12px;color:var(--mut)}
.amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--mint)}
.goal{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:var(--card2);border:1px solid var(--line)}
.sub{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.fbars{display:flex;align-items:flex-end;gap:8px;height:170px;position:relative;padding-top:10px}
.fbars .fb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.fbars .fb .pair{display:flex;gap:3px;align-items:flex-end;justify-content:center;flex:1}
.fbars .fb .pair i{display:block;width:44%;max-width:22px;border-radius:6px 6px 4px 4px;transform-origin:bottom;animation:growY .9s var(--ease) both}
.fbars .fb span{font-size:11.5px;color:var(--mut);text-align:center}
.concl{display:flex;flex-direction:column;gap:8px}
.concl div{display:flex;gap:10px;font-size:13.5px;line-height:1.4;color:var(--mut)}
.concl div b{color:var(--txt)}

/* ---------- Plan / Estudios ---------- */
.obj{padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:14px}
.mile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:14px}
.mile.ok .tx{text-decoration:line-through;color:var(--mut)}
.subj{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;border:1.5px solid var(--line);min-height:180px;text-align:left;color:var(--txt)}
.subj.sel{border-color:var(--txt)}
.tl{position:relative;min-width:760px;height:130px}
.tl .ln{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--line2)}

/* ---------- Preferencias / Login ---------- */
.pref{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.pref .tx{flex:1;min-width:0}
.pref .tx b{display:block;font-size:15px}
.pref .tx span{font-size:13px;color:var(--mut)}
.sw{width:50px;height:30px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);position:relative;transition:.25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.25s var(--ease)}
.sw.on{background:var(--sky);border-color:var(--sky)}
.sw.on::after{left:23px;background:var(--on-sky)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lcard{width:min(420px,100%);padding:32px 28px;border-radius:30px;background:var(--card);border:1px solid var(--line2);backdrop-filter:blur(26px);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.lcard .logo{justify-content:center;font-size:24px;margin-bottom:4px}
.lcard h1{font-size:26px;font-weight:800;text-align:center}
.lcard p.sub2{text-align:center;color:var(--mut);font-size:14px;margin-top:-6px}
.pw{position:relative}
.pw .ibtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:40px;height:40px}
.or{display:flex;align-items:center;gap:12px;color:var(--mut2);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}

/* ---------- Adaptación ---------- */
@media (max-width:1180px){
  .nav a{padding:9px 11px;font-size:13.5px}
  .qk span.t,.qk kbd{display:none}
  .s4,.s5,.s6,.s7,.s8{grid-column:span 12}
  .hlay,.tlay2,.jlay{grid-template-columns:1fr}
}

}

  .tools{margin-left:auto}

  .head h1{font-size:28px;min-width:0;width:100%}
  .kpis{gap:12px 22px}

  .kpi b{font-size:18px}
  .dash{grid-template-columns:1fr}

  .board{grid-template-columns:repeat(4,82vw);scroll-snap-type:x mandatory}

  .ringw{width:250px;height:250px}

  .qa{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
  .qa .btn{flex:none}
  /* barra inferior */
  .mnav{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;justify-content:space-around;align-items:center;padding:6px;border-radius:24px;background:rgba(16,30,56,.82);border:1px solid var(--line2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);padding-bottom:max(6px,env(safe-area-inset-bottom))}
  [data-theme=light] .mnav{background:rgba(255,255,255,.88)}

  .mnav .on{color:var(--txt);background:rgba(124,196,255,.16)}
  .mnav .on svg{color:var(--sky)}
  .fab{display:grid;place-items:center;position:fixed;right:20px;bottom:92px;z-index:41;width:58px;height:58px;border-radius:20px;background:var(--grad);color:var(--on-sky);box-shadow:0 12px 30px rgba(79,157,255,.45)}
  /* ventanas como hoja inferior */
  .ovl{place-items:end center;padding:0}
  .dlg,.dlg.wide{width:100%;max-height:92vh;border-radius:26px 26px 0 0;animation:sheet .35s var(--ease)}
  .dlg::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line2);margin:10px auto 0}
  .pal{margin-top:0;align-self:end}
  .toast{bottom:96px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.s3{grid-column:span 3}
@media (max-width:1180px){.s3{grid-column:span 6}}
@media (max-width:820px){.s3{grid-column:auto}}
.view.noanim,.view.noanim .stg>*,.view.noanim .bar>i,.view.noanim .wbars .wb i,.view.noanim .fbars .fb .pair i{animation:none!important}
body.is-login .top,body.is-login .mnav,body.is-login .fab{display:none!important}
body.is-login main{padding:0;max-width:none}
@media (max-width:820px){.sisy{grid-template-columns:1fr!important}}
main:focus,main:focus-visible{outline:none}
.jlay>*,.hlay>*,.tlay2>*,.tlay>*,.dash>*,.grid>*{min-width:0}
.ch{flex-wrap:wrap}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}

.wsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:16px}

.head .date{white-space:nowrap}

  .madd{justify-self:center;width:56px;height:56px;border-radius:20px;background:var(--grad);color:var(--on-sky);display:grid;place-items:center;box-shadow:0 8px 22px rgba(79,157,255,.45),0 0 0 5px rgba(16,30,56,.9);transform:translateY(-14px);transition:transform .25s var(--ease)}
  [data-theme=light] .madd{box-shadow:0 8px 22px rgba(31,111,209,.35),0 0 0 5px rgba(255,255,255,.95)}

  body.nav-hide .mnav{transform:translateY(calc(100% + 24px));opacity:0}

  [data-theme=light] .mini{background:rgba(255,255,255,.95)}

  .mini .mico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(124,196,255,.16);color:var(--sky);flex:none}

@media (max-width:360px){.mnav a span,.mnav #moreBtn span{font-size:10px}.madd{width:50px;height:50px}}

/* ===== Tema Negro ===== */
[data-theme=black]{
  --bg:#000; --bg2:#0a0a0c;
  --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.04); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --txt:#f4f4f5; --mut:#a1a1aa; --mut2:#7a7a84;
  --sky:#8ccfff; --sky2:#5aa8ff; --peri:#b4bcff; --mint:#74e8cc; --sun:#ffd27a; --rose:#ff9eb5; --cloud:#e4e4e7;
  --on-sky:#04121f; --shadow:0 20px 50px rgba(0,0,0,.7);
  --grad:linear-gradient(135deg,#e8f4ff,#8ccfff);
  --cg1:#ffffff; --cg2:#9fd6ff;
}
[data-theme=black] body{background:#000}
[data-theme=black] .sky{background:radial-gradient(120% 70% at 50% -10%,#141418 0%,#060607 50%,#000 100%)}
[data-theme=black] .sky .cl{background:rgba(255,255,255,.035)}
[data-theme=black] .sky .c2{background:rgba(140,207,255,.04)}
[data-theme=black] .sky svg.puffs{opacity:.05}
[data-theme=black] .stars{opacity:.6}
[data-theme=black] .top{background:linear-gradient(#000 0%,transparent 100%)}
[data-theme=black] .nav{background:rgba(255,255,255,.04)}
[data-theme=black] .nav .ind,[data-theme=black] .mind{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14)}
[data-theme=black] .card::before{background:linear-gradient(160deg,rgba(255,255,255,.04),transparent 40%)}
[data-theme=black] .dlg{background:linear-gradient(180deg,#141416,#0c0c0e);border-color:rgba(255,255,255,.12)}
[data-theme=black] .ovl{background:rgba(0,0,0,.7)}
[data-theme=black] .menu,[data-theme=black] .toast{background:#141416}
[data-theme=black] .inp{background:rgba(255,255,255,.03)}
[data-theme=black] .inp:focus{background:rgba(255,255,255,.05)}
[data-theme=black] select.inp option{background:#141416}
[data-theme=black] .col{background:rgba(255,255,255,.02)}
[data-theme=black] .chip.on,[data-theme=black] .seg button.on,[data-theme=black] .tside button.on,[data-theme=black] .stage .st.now,[data-theme=black] .opt.on{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
[data-theme=black] .ava{background:linear-gradient(135deg,#f4f4f5,#c9d6e3);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
[data-theme=black] .logo .mk{box-shadow:0 6px 20px rgba(140,207,255,.2)}
[data-theme=black] .btn.pri{box-shadow:0 8px 22px rgba(140,207,255,.18)}
@media (max-width:820px){
  [data-theme=black] .mnav{background:rgba(14,14,16,.9);border-color:rgba(255,255,255,.1)}
  [data-theme=black] .mnav .madd::before{background:#000}
  [data-theme=black] .mnav .madd .mcloud{filter:drop-shadow(0 8px 14px rgba(140,207,255,.25))}
  [data-theme=black] .mini{background:rgba(20,20,22,.95);border-color:rgba(255,255,255,.14)}
  [data-theme=black] .mbadge{box-shadow:0 0 0 2px #0e0e10}
}
/* aviso del atajo A/B */
.abhint{position:fixed;top:50%;left:22px;z-index:75;transform:translate(-12px,-50%);opacity:0;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line2);backdrop-filter:blur(16px);box-shadow:var(--shadow);font-size:14px;font-weight:700;pointer-events:none;transition:opacity .15s,transform .2s var(--ease)}
.abhint.right{left:auto;right:22px;transform:translate(12px,-50%)}
.abhint.on{opacity:1;transform:translate(0,-50%)}
.abhint kbd{font:inherit;font-size:12px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:var(--card2);border:1px solid var(--line2)}
.abhint svg{color:var(--sky)}
@media (max-width:820px){.abhint{display:none}}

/* ===== Nubes sueltas por el fondo ===== */
.sky svg.puffs{display:none}
.puff{position:absolute;height:auto;fill:var(--puff);opacity:var(--po,.07);filter:blur(.6px);animation:drift var(--d,50s) ease-in-out var(--dl,0s) infinite alternate;will-change:transform}
.puff:nth-child(odd){--po:.055}
.puff:nth-of-type(3n){--po:.09}
:root{--puff:#d8e8ff}
[data-theme=light]{--puff:#ffffff}
[data-theme=light] .puff{opacity:.9;filter:drop-shadow(0 6px 14px rgba(40,90,160,.08))}
[data-theme=light] .puff:nth-child(odd){opacity:.75}
[data-theme=black]{--puff:#ffffff}
[data-theme=black] .puff{opacity:.035}
[data-theme=black] .puff:nth-of-type(3n){opacity:.05}
@keyframes drift{from{transform:translateX(-24px)}to{transform:translateX(28px)}}
@media (max-width:820px){.puff{width:calc(var(--w,1)*1px);max-width:46vw}.puff:nth-of-type(n+8){display:none}}
@media (prefers-reduced-motion:reduce){.puff{animation:none}}
[data-theme=light] .puff{opacity:.55;filter:drop-shadow(0 6px 14px rgba(40,90,160,.06))}
[data-theme=light] .puff:nth-child(odd){opacity:.42}
/* ===== Asistente paso a paso ===== */
.dlg.wiz{width:min(560px,100%);display:flex;flex-direction:column;overflow:hidden;min-height:420px}
.wiz-top{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
.wiz-top .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(124,196,255,.15);color:var(--sky)}
.wiz-title{font-weight:800;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz-count{font-size:12.5px;color:var(--mut);font-weight:700;white-space:nowrap}
.wiz-prog{height:4px;margin:0 20px;border-radius:4px;background:var(--card2);overflow:hidden}
.wiz-prog i{display:block;height:100%;width:0;border-radius:4px;background:var(--grad);transition:width .45s var(--ease)}
.wiz-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:26px 22px 8px;overflow:auto;min-height:0}
.wiz-body.from-right{animation:wizR .35s var(--ease)}
.wiz-body.from-left{animation:wizL .35s var(--ease)}
@keyframes wizR{from{opacity:0;transform:translateX(28px)}}
@keyframes wizL{from{opacity:0;transform:translateX(-28px)}}
.wiz-q{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.wiz-opt{font-size:12px;font-weight:700;color:var(--mut2);letter-spacing:0;vertical-align:middle;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.wiz-hint{font-size:13.5px;color:var(--mut);margin-top:-6px}
.wiz-field{position:relative}
.wiz-in{font-size:18px;min-height:54px;padding:12px 16px;border-radius:16px}
textarea.wiz-in{font-size:16px;min-height:110px}
.wiz-field.amt .wiz-in{font-size:30px;font-weight:800;padding-right:48px;font-variant-numeric:tabular-nums}
.wiz-eur{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:800;color:var(--mut)}
.wiz-quick{display:flex;gap:8px;flex-wrap:wrap}
.wiz-choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wiz-chip{display:flex;align-items:center;gap:10px;min-height:54px;padding:10px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);font-size:15px;font-weight:700;text-align:left;transition:border-color .2s,background .2s,transform .15s}
.wiz-chip:hover{border-color:var(--line2)}
.wiz-chip.on{border-color:var(--sky);background:rgba(124,196,255,.14)}
.wiz-chip:active{transform:scale(.97)}
.wiz-chip small{display:block;font-size:11.5px;color:var(--mut);font-weight:600;margin-left:auto}
.wiz-chip svg{color:var(--sky)}
.wiz-icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.wiz-ico{aspect-ratio:1;border-radius:16px;border:1.5px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--txt)}
.wiz-ico.on{border-color:var(--sky);background:rgba(124,196,255,.16);color:var(--sky)}
.wiz-colors{display:flex;gap:14px;flex-wrap:wrap}
.wiz-color{width:52px;height:52px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line2);transition:transform .15s}
.wiz-color.on{border-color:var(--txt);transform:scale(1.08)}
.wiz-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wiz-day{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);font-weight:800;font-size:15px;background:var(--card2)}
.wiz-day[aria-pressed=true]{background:var(--sky);border-color:var(--sky);color:var(--on-sky)}
.wiz-sum{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.wiz-sum>div{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.wiz-sum>div:last-child{border-bottom:0}
.wiz-sum dt{width:110px;flex:none;font-size:12.5px;font-weight:700;color:var(--mut)}
.wiz-sum dd{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.wiz-sum dd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wiz-edit{color:var(--sky);font-weight:800;font-size:13px;min-height:36px;padding:0 8px;border-radius:10px}
.wiz-edit:hover{background:rgba(124,196,255,.1)}
.wiz .err{padding:0 22px}
.wiz-act{display:flex;align-items:center;gap:8px;padding:14px 20px 20px;flex-wrap:wrap}
.wiz-act [hidden]{display:none}
@media (max-width:820px){
  .dlg.wiz{min-height:62vh}
  .wiz-q{font-size:21px}
  .wiz-choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wiz-icons{grid-template-columns:repeat(4,minmax(0,1fr))}
  .wiz-act{padding-bottom:max(20px,env(safe-area-inset-bottom))}
  .wiz-act #wizBack{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){.wiz-body.from-right,.wiz-body.from-left{animation:none}}

</style>
</head>

function parseQuick(text) {

  if (/\bpasado mañana\b/i.test(t)) { due = dayIso(2); t = t.replace(/\bpasado mañana\b/i, ""); }
  else if (/\bmañana\b/i.test(t)) { due = dayIso(1); t = t.replace(/\bmañana\b/i, ""); }
  else if (/\bhoy\b/i.test(t)) { due = dayIso(0); t = t.replace(/\bhoy\b/i, ""); }
  const dn = t.match(/\b(el )?(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/i);
  if (dn && !due) { const target = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"].indexOf(dn[2].toLowerCase().replace("miercoles", "miércoles").replace("sabado", "sábado")); let n = (target - TODAY.getDay() + 7) % 7 || 7; due = dayIso(n); t = t.replace(dn[0], ""); }
  const tm = t.match(/\b(\d{1,2})(:(\d{2}))?\s*h\b|\b(\d{1,2}):(\d{2})\b/); if (tm) { time = `${pad(tm[1] || tm[4])}:${tm[3] || tm[5] || "00"}`; t = t.replace(tm[0], ""); }
  const title = t.replace(/\s+/g, " ").trim();
  return { title: title.charAt(0).toUpperCase() + title.slice(1), due, prio, tags, time };
}

let tFilter = "hoy", tView = "lista", tSearch = "", tPrio = 0, tTag = "", tSort = "fecha", foldDone = true;
function taskList() {
  let l = S.tasks.slice();
  if (tFilter === "bandeja") l = l.filter((t) => !t.project && !t.done);
  else if (tFilter === "hoy") l = l.filter((t) => !t.done && t.due && diffDays(t.due) <= 0);
  else if (tFilter === "proximas") l = l.filter((t) => !t.done && t.due && diffDays(t.due) > 0);
  else if (tFilter === "pendientes") l = l.filter((t) => !t.done);
  else if (tFilter === "completadas") l = l.filter((t) => t.done);
  else if (tFilter.startsWith("p:")) l = l.filter((t) => t.project === tFilter.slice(2));
  else if (tFilter.startsWith("#")) l = l.filter((t) => t.tags.includes(tFilter.slice(1)));
  if (tSearch) l = l.filter((t) => (t.title + " " + t.desc + " " + t.tags.join(" ")).toLowerCase().includes(tSearch.toLowerCase()));
  if (tPrio) l = l.filter((t) => t.prio === tPrio); if (tTag) l = l.filter((t) => t.tags.includes(tTag));
  l.sort(tSort === "prioridad" ? (a, b) => a.prio - b.prio : tSort === "nombre" ? (a, b) => a.title.localeCompare(b.title) : (a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  return l;
}

binders.finanzas = (m) => {

};
function exportCSV() {
  const rows = [["fecha", "tipo", "concepto", "categoria", "importe", "nota"], ...S.moves.map((x) => [x.date, x.income ? "ingreso" : "gasto", x.title, x.cat, (x.cents / 100).toFixed(2).replace(".", ","), x.note])];
  const csv = rows.map((r) => r.map((v) => /[;"\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v).join(";")).join("\n");
  dialog({ title: "Exportar CSV", icon: "download", cancelLabel: "Cerrar", body: `<p class="mut sm">${S.moves.length} movimientos, separados por punto y coma (se abre bien en Excel y LibreOffice).</p><textarea class="inp" rows="8" readonly style="font-family:monospace;font-size:12.5px">${esc(csv)}</textarea>`, submitLabel: "Copiar", submit: () => { navigator.clipboard?.writeText(csv).then(() => toast("CSV copiado"), () => toast("No se pudo copiar: selecciona el texto")); return true; } });
}

const NAV_ORIG = NAV.map((x) => [...x]);

/* ====================== LOGIN ====================== */
function renderLogin() {
  current = "login"; document.body.classList.add("is-login");
  $("#main").innerHTML = `<div class="login view"><form class="lcard" id="loginF" novalidate>
    <div class="logo"><span class="mk">${ico("cloud", 22, 2)}</span>CloudSpace</div>
    <h1>Bienvenido de nuevo</h1><p class="sub2">Tu espacio personal, por encima de las nubes.</p>
    ${field("Correo", `<input class="inp" type="email" name="email" autocomplete="email" value="${esc(S.user.email)}" placeholder="tu@correo.com">`)}
    ${fieldDiv('<span class="row" style="justify-content:space-between"><span>Contraseña</span><a href="#" data-forgot style="font-size:12.5px;text-decoration:none">¿La olvidaste?</a></span>', `<div class="pw"><label class="sr" for="pw">Contraseña</label><input class="inp" id="pw" type="password" name="pw" autocomplete="current-password" placeholder="••••••••" style="padding-right:48px"><button type="button" class="ibtn" data-eye aria-label="Mostrar contraseña">${ico("eye", 18)}</button></div>`)}
    <label class="row sm" style="gap:10px;cursor:pointer"><input type="checkbox" name="keep" checked style="width:20px;height:20px;accent-color:var(--sky)"> Mantener la sesión iniciada</label>
    <p class="err" id="lerr" role="alert"></p>
    <button class="btn pri" style="width:100%">Entrar</button>
    <div class="or">o</div>
    <button type="button" class="btn gh" style="width:100%" data-google>${ico("google", 18)}Continuar con Google</button>
    <button type="button" class="btn gh" style="width:100%" data-guest>${ico("user", 18)}Probar como invitado</button>
    <p class="hint" style="text-align:center">La contraseña nunca se guarda en el navegador.</p></form></div>`;
  const f = $("#loginF");
  f.addEventListener("submit", (e) => { e.preventDefault(); const em = f.email.value.trim(), pw = f.pw.value; if (!/^\S+@\S+\.\S+$/.test(em)) { $("#lerr").textContent = "Escribe un correo válido."; return; } if (pw.length < 6) { $("#lerr").textContent = "La contraseña tiene al menos 6 caracteres."; return; } location.hash = "resumen"; toast("Hola de nuevo, " + S.user.name.split(" ")[0]); });
  f.querySelector("[data-eye]").onclick = (e) => { const i = f.pw, b = e.currentTarget, show = i.type === "password"; i.type = show ? "text" : "password"; b.innerHTML = ico(show ? "eyeoff" : "eye", 18); b.setAttribute("aria-label", show ? "Ocultar contraseña" : "Mostrar contraseña"); };
  f.querySelector("[data-forgot]").onclick = (e) => { e.preventDefault(); toast("Si el correo existe, te llegará un enlace para cambiarla"); };
  f.querySelector("[data-google]").onclick = () => { location.hash = "resumen"; };
  f.querySelector("[data-guest]").onclick = () => { location.hash = "resumen"; toast("Modo invitado: los datos solo se guardan en este navegador"); };
}

"use strict";
/* ================= Arranque ================= */
try { const th = localStorage.getItem("cs.theme"); if (th) S.prefs.theme = th; } catch (e) {}
$("#logoMk").innerHTML = ico("cloud", 22, 2);
$("#qkIco").innerHTML = ico("search", 17);
$("#searchM").innerHTML = ico("search", 19);
$("#fab").innerHTML = ico("plus", 28, 2.4);
$("#avaBtn").textContent = initials();
renderChrome(); applyTheme();
$("#qkBtn").onclick = openPalette; $("#searchM").onclick = openPalette;
$("#themeBtn").onclick = () => { S.prefs.theme = nextTheme()[0]; applyTheme(); toast("Tema: " + THEMES.find((t) => t[0] === S.prefs.theme)[1]); save(); if (current === "preferencias") rerender(); };
// Botón + del móvil: crea según la sección en la que estás
$("#fab").onclick = () => {
  const map = { tareas: () => taskForm(), habitos: () => habitForm(), finanzas: () => moveForm(), diario: () => ideaForm(), plan: () => objectiveForm(), estudios: () => examForm(), tiempo: () => routineForm() };
  if (map[current]) return map[current]();
  dialog({ title: "Añadir", icon: "plus", cancelLabel: "Cerrar", body: `<div class="sheet-grid">${[["task", "Tarea", "tasks"], ["habit", "Hábito", "habit"], ["gasto", "Gasto", "euro"], ["ingreso", "Ingreso", "download"], ["idea", "Idea", "bulb"], ["focus", "Enfoque", "timer"]].map(([k, l, i]) => `<a href="#" data-add="${k}"><span class="ic">${ico(i, 22)}</span>${l}</a>`).join("")}</div>`,
    onOpen: (f) => f.addEventListener("click", (e) => { const a = e.target.closest("[data-add]"); if (!a) return; e.preventDefault(); closeDlg(); ({ task: () => taskForm(), habit: () => habitForm(), gasto: () => moveForm(), ingreso: () => moveForm(null, { income: true, cat: "Salario" }), idea: () => ideaForm(), focus: () => { timerMode = "pomodoro"; location.hash = "tiempo"; setTimeout(startTimer, 260); } })[a.dataset.add](); }) });
};
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
});

$("#searchM").style.display = innerWidth <= 820 ? "" : "none";

let lastY = scrollY;
window.addEventListener("scroll", () => { const y = scrollY, d = y - lastY; if (Date.now() - progScroll < 400) { lastY = y; return; } if (Math.abs(d) < 6) return; document.body.classList.toggle("nav-hide", d > 0 && y > 120 && !$(".ovl")); lastY = y; }, { passive: true });
setTimeout(moveMind, 300); document.fonts?.ready.then(moveMind);

// Atajo de PC: pulsar A dos veces rápido = apartado anterior; B dos veces = siguiente
const SEQ = () => [...NAV.map((n) => n[0]), "preferencias"];
let abLast = { key: "", t: 0 };
function isTyping(el) { return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)); }
document.addEventListener("keydown", (e) => {
  if (!S.prefs.abNav || innerWidth <= 820 || matchMedia("(pointer: coarse)").matches) return;
  const k = e.key.toLowerCase(); if (k !== "a" && k !== "b") { abLast.key = ""; return; }
  if (e.ctrlKey || e.metaKey || e.altKey || e.shiftKey || e.repeat || isTyping(document.activeElement) || $(".ovl") || current === "login") return;
  const now = Date.now();
  const seq = SEQ(), i = Math.max(0, seq.indexOf(current)), target = seq[(i + (k === "a" ? -1 : 1) + seq.length) % seq.length];
  const label = target === "preferencias" ? "Ajustes" : NAV.find((n) => n[0] === target)[1];
  if (abLast.key === k && now - abLast.t < 380) { abLast.key = ""; abHint(null); location.hash = target; return; }
  abLast = { key: k, t: now }; abHint(k, label);
});
let abT;
function abHint(k, label) {
  let h = $("#abHint"); if (!h) { h = document.createElement("div"); h.id = "abHint"; h.className = "abhint"; h.setAttribute("aria-hidden", "true"); document.body.appendChild(h); }
  clearTimeout(abT); if (!k) { h.classList.remove("on"); return; }
  h.innerHTML = k === "a" ? `<kbd>A</kbd>${ico("chevL", 16)}<span>${esc(label)}</span>` : `<span>${esc(label)}</span>${ico("chevR", 16)}<kbd>B</kbd>`;
  h.classList.toggle("right", k === "b"); h.classList.add("on"); abT = setTimeout(() => h.classList.remove("on"), 420);
}
